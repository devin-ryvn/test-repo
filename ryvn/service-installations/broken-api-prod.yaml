kind: ServiceInstallation
metadata:
  name: broken-api-prod
spec:
  service: broken-api
  environment: production
  namespace: default
  config: |
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
  env:
    - key: APP_MODE
      value: api
    - key: OPENAI_API_KEY
      isSecret: true
